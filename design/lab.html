<!doctype html>
<html lang="en">
<!-- Vanna Mobile V2 device lab: template. lab/build_lab.py inlines lab.css and lab.js and writes dist/lab.html. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Vanna Device Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Vanna Mobile V2 device lab. Design System V2 palette (vanna-tokens.json), Plus Jakarta Sans, brand gradient only as an accent. */
:root {
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bg: #F7F7F7; --surface: #FFFFFF; --raised: #F4F4F4; --text: #1F1F1F; --muted: #595959; --faint: #949494; --line: #DFDFDF;
  --link: #703AE6; --pos: #1C7C83; --neg: #B33C3E; --warn: #8C0043;
  --on: #1F1F1F; --onink: #FFFFFF; --hover: rgba(17, 17, 17, .06); --strip: rgba(255, 255, 255, .92); --glow: rgba(112, 58, 230, .07);
  --brand: linear-gradient(120deg, #FC5457 0%, #703AE6 100%);
  --dev-shadow: 0 34px 60px -28px rgba(17, 17, 17, .45), 0 10px 22px -14px rgba(17, 17, 17, .35);
  --t-compact-bg: #F1EBFD; --t-compact: #5029A3; --t-short-bg: #FFE6F2; --t-short: #8C0043;
  --t-medium-bg: #EBFCFD; --t-medium: #155F64; --t-expanded-bg: #FFEEEE; --t-expanded: #8B2E30;
  --strip-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --surface: #1E1E1E; --raised: #161616; --text: #FFFFFF; --muted: #BFBFBF; --faint: #777777; --line: #2C2C2C;
    --link: #BDA4F4; --pos: #32E2EE; --neg: #FC5457; --warn: #FFB0D6;
    --on: #FFFFFF; --onink: #111111; --hover: rgba(255, 255, 255, .07); --strip: rgba(30, 30, 30, .92); --glow: rgba(112, 58, 230, .16);
    --dev-shadow: 0 34px 70px -28px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .06);
    --t-compact-bg: #2F1861; --t-compact: #D3C2F7; --t-short-bg: #6B0033; --t-short: #FFB0D6;
    --t-medium-bg: #155F64; --t-medium: #BFF6FA; --t-expanded-bg: #6A2325; --t-expanded: #FECACB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --surface: #1E1E1E; --raised: #161616; --text: #FFFFFF; --muted: #BFBFBF; --faint: #777777; --line: #2C2C2C;
  --link: #BDA4F4; --pos: #32E2EE; --neg: #FC5457; --warn: #FFB0D6;
  --on: #FFFFFF; --onink: #111111; --hover: rgba(255, 255, 255, .07); --strip: rgba(30, 30, 30, .92); --glow: rgba(112, 58, 230, .16);
  --dev-shadow: 0 34px 70px -28px rgba(0, 0, 0, .9), 0 0 0 1px rgba(255, 255, 255, .06);
  --t-compact-bg: #2F1861; --t-compact: #D3C2F7; --t-short-bg: #6B0033; --t-short: #FFB0D6;
  --t-medium-bg: #155F64; --t-medium: #BFF6FA; --t-expanded-bg: #6A2325; --t-expanded: #FECACB;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: var(--font); font-variant-ligatures: no-contextual; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.i { display: block; flex: none; }

/* ===== Strip ===== */
.strip { position: sticky; top: 0; z-index: 20; background: var(--strip); border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.strip::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--brand); opacity: .5; }
.strip-in { display: flex; align-items: flex-start; gap: 8px 18px; padding: 8px 16px 6px; }
.strip-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 6px 16px 8px; border-top: 1px solid var(--line); }
.sub-v { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; min-width: 0; flex: 1; }
.sub-v:empty { display: block; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; min-height: 32px; }
.brand-logo { display: block; color: var(--text); }
.logo-svg { display: block; height: 20px; width: auto; }
.brand-t { display: flex; flex-direction: column; font: 700 13px/16px var(--font); padding-left: 10px; border-left: 1px solid var(--line); }
.brand-t small { font: 500 11px/14px var(--font); color: var(--muted); }
.ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; flex: 1; min-width: 0; }
.sum { flex: 1; min-width: 0; align-self: center; font: 500 12px/16px var(--font); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sum b { color: var(--text); font-weight: 600; }
.grp { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
.gl { font: 600 10.5px/14px var(--font); letter-spacing: .5px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.seg { display: inline-flex; align-items: center; padding: 2px; gap: 2px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); max-width: 100%; }
.seg button { border: 0; background: none; min-height: 28px; padding: 4px 8px; border-radius: 999px; font: 600 12px/16px var(--font); color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button:hover:not([aria-pressed="true"]):not(:disabled) { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--on); color: var(--onink); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.seg-div { width: 1px; height: 16px; background: var(--line); margin: 0 1px; flex: none; }
.grp-view .seg button[aria-pressed="true"] { box-shadow: inset 0 -2px 0 0 transparent; position: relative; }
.grp-view .seg button[aria-pressed="true"]::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--brand); }
.sel { position: relative; display: inline-flex; }
.sel select { height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 0 30px 0 12px;
  font: 600 12px/16px var(--font); -webkit-appearance: none; appearance: none; cursor: pointer; max-width: 220px; }
.sel::after { content: ''; position: absolute; right: 13px; top: 11px; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
.acts { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.act { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font: 600 12px/16px var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; }
.act:hover { background: var(--hover); }
.act .i { width: 16px; height: 16px; }
.act[aria-expanded="true"]:not(#ctrl-btn) { border-color: var(--text); }
#ctrl-btn .i { transition: transform .2s; }
#ctrl-btn[aria-expanded="false"] .i { transform: rotate(180deg); }
.act-pri { background: var(--on); color: var(--onink); border-color: transparent; }
.act-pri:hover { background: var(--on); opacity: .88; }

/* ===== Stage ===== */
.body { display: flex; align-items: flex-start; }
.stage { flex: 1; min-width: 0; min-height: calc(100vh - var(--strip-h)); background: radial-gradient(1100px 520px at 50% -8%, var(--glow), transparent 72%); }
.hint { font: 500 12px/16px var(--font); color: var(--muted); }
.devs { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; align-content: flex-start; gap: 28px; padding: 16px 16px 22px; }

/* ===== Device ===== */
.dv { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; flex: none; }
.dv-box { position: relative; display: flex; align-items: flex-end; justify-content: center; }
.dv-fit { position: relative; flex: none; }
.dv-scale { position: absolute; left: 0; top: 0; transform-origin: 0 0; --ring0: #26262A; --ring1: #55555B; --glass-bezel: #060607; }
.dv-scale[data-kind="iphone"] { --ring0: #2A292D; --ring1: #6A6970; }
.dv-scale[data-kind="ipad"] { --ring0: #34353A; --ring1: #74757B; --glass-bezel: #0A0A0B; }
.dv-scale[data-kind="fold"] { --ring0: #26272B; --ring1: #5C5D63; }
.dv-hw { position: absolute; inset: 0; }
.hw-body { position: absolute; background: var(--glass-bezel); box-shadow: inset 0 0 0 2px var(--ring1), inset 0 0 0 3.5px var(--ring0), 0 0 0 1px rgba(0, 0, 0, .35), var(--dev-shadow); }
.hw-btn { position: absolute; border-radius: 2px; background: linear-gradient(90deg, var(--ring0), var(--ring1)); }
.hw-cam { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #3A3A46 0, #0B0B0E 70%); }
.dv-screen { position: absolute; overflow: hidden; isolation: isolate; background: var(--app-bg); }
.dv-screen iframe.app { position: absolute; border: 0; display: block; background: var(--app-bg); z-index: 1; }
.dv-chrome { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.dv.morph .dv-scale { animation: morph .5s ease; }
@keyframes morph { 0% { opacity: .15; } 100% { opacity: 1; } }

.dv-screen[data-ui="light"] { --app-bg: #F7F7F7; --cr-bg: #FFFFFF; --cr-pill: #EFEFF1; --cr-ink: #1F1F1F; --cr-mut: #6B6B70; --cr-line: #E4E4E7;
  --glass: rgba(255, 255, 255, .9); --glass-line: rgba(0, 0, 0, .08); --tab-bg: #E6E6EA; --hi: #111111; --crease: rgba(0, 0, 0, .1); --udc: rgba(0, 0, 0, .16); --lockc: #1C7C83; }
.dv-screen[data-ui="dark"] { --app-bg: #111111; --cr-bg: #1E1E1E; --cr-pill: #2C2C2C; --cr-ink: #FFFFFF; --cr-mut: #A9A9A9; --cr-line: #2C2C2C;
  --glass: rgba(56, 56, 60, .88); --glass-line: rgba(255, 255, 255, .09); --tab-bg: #0B0B0B; --hi: #FFFFFF; --crease: rgba(255, 255, 255, .07); --udc: rgba(255, 255, 255, .08); --lockc: #32E2EE; }

/* chrome rows */
.cr { position: absolute; left: 0; right: 0; color: var(--cr-ink); font-family: var(--font); }
.cr .i { color: currentColor; }
.cr-status { background: var(--cr-bg); }
.dv-screen[data-chrome="safari"] .cr-status { background: var(--app-bg); }
.sb { display: flex; align-items: center; justify-content: space-between; height: 100%; }
.ink-dark { color: #111111; }
.ink-light { color: #FFFFFF; }
.sb-ic { display: flex; align-items: center; gap: 6px; }
.sb-iphone { align-items: flex-start; padding-top: 19px; }
.sb-iphone .sb-t, .sb-iphone .sb-ic { width: calc(50% - 63px); justify-content: center; text-align: center; }
.sb-iphone .sb-t { font: 600 17px/22px var(--font); letter-spacing: -.2px; }
.sb-iphone .sb-ic { padding-top: 5px; gap: 6px; }
.sb-iphone .sb-sig { height: 12px; width: 18px; } .sb-iphone .sb-wifi { height: 12px; width: 17px; } .sb-iphone .sb-batt { height: 12.5px; width: 27px; }
.sb-ipad { padding: 0 22px; font: 600 12px/16px var(--font); }
.sb-ipad .sb-t span { font-weight: 500; margin-left: 4px; }
.sb-ipad .sb-ic { gap: 5px; }
.sb-ipad .sb-wifi { height: 10px; width: 14px; } .sb-ipad .sb-batt { height: 10.5px; width: 23px; }
.sb-pct { font: 600 12px/16px var(--font); }
.sb-and { padding: 0 20px 0 24px; font: 500 13px/16px var(--font); }
.sb-and .sb-ic { gap: 4px; }
.sb-and .sb-aw { height: 13px; width: 14px; } .sb-and .sb-as { height: 13px; width: 13px; } .sb-and .sb-ab { height: 14px; width: 13px; }

.cr-sf-bar, .cr-sf-top { background: var(--app-bg); }
.sf-row { display: flex; align-items: center; gap: 10px; padding: 6px 14px 0; }
.sf-b { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.sf-b .i { width: 22px; height: 22px; }
.sf-url { flex: 1; min-width: 0; height: 48px; border-radius: 24px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font: 500 15px/20px var(--font); }
.sf-url .i { width: 19px; height: 19px; }
.sf-d { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.glass { background: var(--glass); box-shadow: 0 0 0 .5px var(--glass-line), 0 6px 18px rgba(0, 0, 0, .08); }
.sf-row-top { justify-content: center; padding: 4px 70px 0; }
.sf-row-top .sf-b { width: 36px; height: 36px; }
.sf-row-top .sf-b .i { width: 19px; height: 19px; }
.sf-row-top .sf-url { flex: 0 1 460px; height: 36px; border-radius: 18px; font-size: 14px; }
.cr-sf-ipad { background: var(--app-bg); border-bottom: 1px solid var(--cr-line); }
.sfi { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 100%; padding: 0 18px; }
.sfi-g { display: flex; align-items: center; gap: 20px; }
.sfi-g .i { width: 22px; height: 22px; }
.sfi .dim { opacity: .35; }
.sfi-url { flex: 0 1 46%; min-width: 0; height: 36px; border-radius: 12px; background: var(--cr-pill); display: flex; align-items: center; gap: 8px; padding: 0 12px; font: 500 14px/18px var(--font); }
.sfi-url .i { width: 18px; height: 18px; }
.cr-cr-tabs { background: var(--tab-bg); }
.crt { display: flex; align-items: flex-end; gap: 8px; height: 100%; padding: 0 10px; }
.crt-tab { display: flex; align-items: center; gap: 8px; height: 32px; width: 220px; padding: 0 10px; border-radius: 10px 10px 0 0; background: var(--cr-bg); font: 500 12px/16px var(--font); }
.crt-tab span { flex: 1; }
.crt-tab .i { width: 14px; height: 14px; color: var(--cr-mut); }
.crt > .i { width: 18px; height: 18px; align-self: center; color: var(--cr-mut); }
.vmark { display: block; flex: none; }
.crt-fav { width: 15px; height: 15px; }
.cr-cr-bar { background: var(--cr-bg); border-bottom: 1px solid var(--cr-line); }
.crb { display: flex; align-items: center; gap: 16px; height: 100%; padding: 0 12px 0 14px; }
.crb-url { flex: 1; min-width: 0; height: 40px; border-radius: 20px; background: var(--cr-pill); display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 500 15px/20px var(--font); }
.crb-url .sf-d { text-align: left; }
.crb-url .i { width: 18px; height: 18px; }
.crb > .i { width: 20px; height: 20px; }
.crb-tabs { width: 20px; height: 20px; border: 2px solid currentColor; border-radius: 5px; display: grid; place-items: center; font: 700 11px/1 var(--font); flex: none; }
.cr-wl-bar { background: var(--cr-bg); border-bottom: 1px solid var(--cr-line); }
.wlb { display: flex; align-items: center; gap: 12px; height: 100%; padding: 0 14px; }
.wlb > .i { width: 20px; height: 20px; }
.wtile { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 700 14px/1 var(--font); flex: none; }
.wlb-t { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.wlb-d { display: flex; align-items: center; gap: 4px; font: 600 13px/17px var(--font); white-space: nowrap; }
.wlb-d .i { width: 11px; height: 11px; color: var(--lockc); }
.wlb-s { font: 500 11px/14px var(--font); color: var(--cr-mut); }
.dv-screen[data-kind="iphone"][data-land="1"] .wlb { padding: 0 70px; }
.cr-over { background: none; }

/* hardware over the screen */
.isl { position: absolute; top: 11px; left: 50%; width: 125px; height: 37px; margin-left: -62.5px; border-radius: 20px; background: #000; z-index: 3; }
.isl-l { top: 50%; left: 11px; width: 37px; height: 125px; margin: -62.5px 0 0 0; }
.punch { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #2C2C36 0, #000 62%); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .85); z-index: 3; }
.udc { position: absolute; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--udc); }
.hinge { position: absolute; top: 0; bottom: 0; left: 50%; width: 22px; margin-left: -11px; background: linear-gradient(90deg, transparent, var(--crease) 46%, var(--crease) 54%, transparent); opacity: .7; }
.hinge::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; margin-left: -.5px; background: var(--crease); }
.hinge-h { left: 0; right: 0; top: 50%; bottom: auto; width: auto; height: 22px; margin: -11px 0 0; background: linear-gradient(180deg, transparent, var(--crease) 46%, var(--crease) 54%, transparent); }
.hinge-h::after { top: 50%; bottom: auto; left: 0; right: 0; width: auto; height: 1px; margin: -.5px 0 0; }
.home { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: var(--hi); opacity: .88; z-index: 3; }
.home-l { width: 210px; margin-left: -105px; bottom: 6px; }
.home-ipad { width: 210px; margin-left: -105px; bottom: 7px; }
.gest { position: absolute; bottom: 7px; left: 50%; width: 108px; height: 4px; margin-left: -54px; border-radius: 2px; background: var(--hi); opacity: .7; z-index: 3; }

/* caption */
.cap { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; max-width: 100%; }
.cap-1 { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; }
.cap-n { font: 600 13px/18px var(--font); color: var(--text); background: none; border: 0; padding: 0 2px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.cap-n { cursor: pointer; }
button.cap-n:hover { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.cap-o { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: var(--muted); flex: none; }
.cap-o:hover { color: var(--text); background: var(--hover); }
.cap-o .i { width: 14px; height: 14px; }
.cap-2 { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 3px 6px; font: 500 11.5px/16px var(--font); color: var(--muted); }
.cap-v { font-variant-numeric: tabular-nums; }
.tier { font: 600 10.5px/16px var(--font); padding: 0 7px; border-radius: 999px; white-space: nowrap; }
.t-compact { background: var(--t-compact-bg); color: var(--t-compact); }
.t-short { background: var(--t-short-bg); color: var(--t-short); }
.t-medium { background: var(--t-medium-bg); color: var(--t-medium); }
.t-expanded { background: var(--t-expanded-bg); color: var(--t-expanded); }
.t-off { background: none; color: var(--neg); box-shadow: inset 0 0 0 1px var(--neg); }
.fold-arrow { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 72px; color: var(--muted); font: 600 11px/14px var(--font); margin-bottom: 60px; flex: none; }
.fold-arrow .i { width: 28px; height: 28px; color: var(--link); }

/* ===== Notes ===== */
.notes { width: 360px; flex: none; position: sticky; top: var(--strip-h); height: calc(100vh - var(--strip-h)); overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-left: 1px solid var(--line); padding: 14px 16px 24px; }
.notes-h { display: flex; align-items: center; justify-content: space-between; }
.notes-h h2 { font: 700 16px/22px var(--font); margin: 0; }
.notes-s { font: 500 12px/17px var(--font); color: var(--muted); margin: 6px 0 12px; }
.x { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--text); flex: none; }
.x:hover { background: var(--hover); }
.x .i { width: 16px; height: 16px; }
.nc { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); margin-bottom: 10px; }
.nc summary { list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 12px; cursor: pointer; border-radius: 14px; }
.nc summary::-webkit-details-marker { display: none; }
.nc summary::after { content: ''; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-2px); flex: none; align-self: center; }
.nc[open] summary::after { transform: rotate(-135deg); }
.nc-n { font: 600 13px/18px var(--font); }
.nc-w { font: 500 11.5px/16px var(--font); color: var(--muted); flex: 1; text-align: right; }
.nc-map { margin: 0 12px 8px; font: 600 12px/16px var(--font); color: var(--warn); }
.nc dl { display: grid; grid-template-columns: 88px 1fr; gap: 6px 10px; margin: 0; padding: 0 12px 12px; font: 500 12px/17px var(--font); }
.nc dt { color: var(--muted); font-weight: 600; }
.nc dd { margin: 0; color: var(--text); min-width: 0; }
.nc code { font: 500 10.5px/15px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; color: var(--muted); }

/* ===== On your phone ===== */
.pop { position: fixed; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px;
  box-shadow: 0 28px 60px -22px rgba(0, 0, 0, .4); }
.pop-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.pop-h h2 { font: 700 15px/20px var(--font); margin: 0; }
.qr { width: 184px; height: 184px; margin: 0 auto 12px; border-radius: 14px; background: #FFFFFF; padding: 10px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.qr svg { display: block; width: 100%; height: 100%; }
.qr-off { font: 500 12px/16px var(--font); color: #595959; text-align: center; margin: 0; }
.pp-l { display: block; font: 600 10.5px/14px var(--font); letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
#pp-url { width: 100%; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 10px; font: 500 12px/16px var(--font); }
.pp-a { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.pp-n { font: 500 12px/17px var(--font); color: var(--muted); margin: 0; }
.pp-w { font: 600 12px/16px var(--font); color: var(--warn); margin: 6px 0 0; }

/* ===== Responsive ===== */
@media (max-width: 1400px) {
  .ctrls .gl-opt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .ctrls .seg button { padding-left: 7px; padding-right: 7px; }
  .sub-v .hint { display: none; }
}
@media (max-width: 1100px) {
  .notes { position: fixed; right: 0; top: var(--strip-h); bottom: 0; height: auto; width: min(360px, calc(100vw - 32px)); z-index: 18; box-shadow: -24px 0 60px -30px rgba(0, 0, 0, .45); }
}
@media (max-width: 720px) {
  .strip-in { flex-direction: column; }
  .seg { flex-wrap: wrap; border-radius: 16px; }
  .acts { margin-left: 0; }
}
@media (pointer: coarse) {
  .seg button { min-height: 36px; padding: 6px 12px; }
  .act, .sel select { height: 40px; }
  .sel::after { top: 15px; }
  .x { width: 40px; height: 40px; }
  .cap-o { width: 32px; height: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

function effCtx(pick, id){

  else if (pick === 'seeker' && id !== 'seeker'){ eff = d.os === 'ios' ? 'safari' : 'chrome'; note = `Seeker needs the Seeker: shown in ${CONTEXTS[eff].label}`; }

}
function geo(id, o, pick){

  const top = [], bottom = [], sa = Object.assign({}, ins);

    } else if (kind === 'chrome'){

/* ===================== Fit ===================== */
function availBox(){
  const devs = $('devs'), cs = getComputedStyle(devs);
  const w = devs.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const top = devs.getBoundingClientRect().top + window.scrollY;
  const h = window.innerHeight - top - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  return { w: Math.max(200, w), h: Math.max(200, h) };
}
function scaleFor(list, extraW){
  const A0 = availBox(), A = { w: A0.w - 8, h: A0.h - 4 }, fs = list.map(x => x.ft), maxW = Math.max(...fs.map(f => f.w));   // slack: rounding never wraps a row
  const widthCap = (A.w - 2) / maxW;
  if (S.z !== 'fit') return Math.max(0.1, Math.min(+S.z / 100, widthCap, 1));
  if (S.view === 'all'){
    const fits = k => {
      let x = 0, rowH = 0, total = 0;
      for (const f of fs){
        const w = Math.max(Math.ceil(f.w * k), CAP_MIN);
        if (x && x + GAP + w > A.w){ total += rowH + capH + GAP; x = 0; rowH = 0; }
        x += (x ? GAP : 0) + w; rowH = Math.max(rowH, Math.ceil(f.h * k));
      }
      return total + rowH + capH <= A.h;
    };
    let lo = 0.1, hi = Math.min(1, widthCap);
    if (fits(hi)) return hi;
    for (let i = 0; i < 18; i++){ const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    return Math.max(0.1, lo * 0.995);
  }
  const sumW = fs.reduce((a, f) => a + f.w, 0), maxH = Math.max(...fs.map(f => f.h));
  const kw = (A.w - GAP * (fs.length - 1) - extraW) / sumW, kh = (A.h - capH) / maxH;
  return Math.max(0.1, Math.min(1, kw, kh));
}

  syncControls();
  const devs = $('devs'), list = slots().map(sl => {
    const g = geo(sl.id, sl.o, S.ctx);
    let ft = foot(g);
    if (sl.box) sl.box.forEach(id => { const f2 = foot(geo(id, sl.o, S.ctx)); ft = { w: Math.max(ft.w, f2.w), h: Math.max(ft.h, f2.h) }; });
    return { sl, g, ft };
  });
  const viewKey = S.view + ':' + (S.view === 'fold' ? S.fm : '');
  if (viewKey !== lastView){
    FIGS.clear(); devs.textContent = ''; lastView = viewKey;
    devs.dataset.view = S.view;
    list.forEach(({ sl }, i) => {
      const fig = newFig(sl); FIGS.set(sl.key, fig); devs.appendChild(fig);
      if (S.view === 'fold' && S.fm === 'side' && i === 0) devs.insertAdjacentHTML('beforeend', `<div class="fold-arrow" aria-hidden="true">${IC.unfold}<span>Unfold</span></div>`);
    });
  }
  const extraW = S.view === 'fold' && S.fm === 'side' ? 72 + GAP : 0;
  const k = scaleFor(list, extraW);
  devs.style.setProperty('--k', k);
  list.forEach(({ sl, g }) => patch(FIGS.get(sl.key), sl, g, k));
  /* the caption height depends on wrapping and on touch sizing: measure it and refit once if the guess was off */
  const ch = Math.max(...[...FIGS.values()].map(f => f.querySelector('.cap').offsetHeight)) + 10;
  if (Math.abs(ch - capH) > 1 && !render.again){ capH = ch; render.again = true; render(); render.again = false; return; }
  routeSelect();
  if (S.notes) renderNotes();
  if (!$('phonepop').hidden) phoneLink();
}

/* ===================== Strip ===================== */
const GROUPS = [
  { k: 'view', label: 'View', opts: [['one', 'One device'], ['all', 'All devices'], ['fold', 'Fold'], ['ipad', 'iPad']] },
  { k: 'dev', label: 'Device', opts: ORDER.map(id => [id, DEVICES[id].short, `${DEVICES[id].name}, ${DEVICES[id].w} x ${DEVICES[id].h}`]) },
  { k: 'o', label: 'Orientation', opts: [['p', 'Portrait'], ['l', 'Landscape']] },
  { k: 't', label: 'Theme', opts: [['light', 'Light'], ['dark', 'Dark']] },
  { k: 'ctx', label: 'Context', opts: Object.entries(CONTEXTS).map(([k, c]) => [k, c.label, c.tip, c.group]) },
  { k: 'chain', label: 'Chain', opts: [['solana', 'Solana'], ['stellar', 'Stellar']] },
  { k: 'auth', label: 'Sign-in', opts: [['email', 'Email'], ['wallet', 'Wallet'], ['out', 'Signed out']] },
  { k: 'vm', label: 'Mascot', opts: [['on', 'On'], ['off', 'Off']], keep: true },
  { k: 'cp', label: 'Copilot', opts: [['locked', 'Locked', 'Testnet gate: Copilot and MCP open after real use of the product'], ['unlocked', 'Unlocked', 'The full Copilot: chat, plan cards, review and sign'], ['mcp', 'MCP open', 'Seven days after the unlock: MCP is open too']], keep: true },
  { k: 'mgc', label: 'Margin chart', opts: [['on', 'On', 'Margin chart (Net P&L | Health factor) at the bottom of the Margin page'], ['off', 'Off', 'Margin page without the chart']], keep: true },
];
function segHTML(gr){
  let last = null;
  const btns = gr.opts.map(([v, t, tip, grp]) => {
    const div = grp && last && grp !== last ? '<i class="seg-div" aria-hidden="true"></i>' : '';
    last = grp || last;
    return `${div}<button type="button" data-k="${gr.k}" data-v="${v}" aria-pressed="false"${tip ? ` title="${esc(tip)}"` : ''}>${esc(t)}</button>`;
  }).join('');
  return `<div class="grp grp-${gr.k}" role="group" aria-labelledby="gl-${gr.k}"><span class="gl${gr.keep ? '' : ' gl-opt'}" id="gl-${gr.k}">${gr.label}</span><span class="seg">${btns}</span></div>`;
}
function buildStrip(){
  $('ctrls').innerHTML = GROUPS.map(segHTML).join('');
  $('stagebar').innerHTML = `<label class="grp grp-route"><span class="gl">Route</span><span class="sel"><select id="route"></select></span></label>
    <div class="sub-v" id="subv"></div>
    <div class="grp grp-z" role="group" aria-labelledby="gl-z"><span class="gl" id="gl-z">Scale</span><span class="seg">${[['fit', 'Fit'], ['50', '50%'], ['75', '75%'], ['100', '100%']].map(([v, t]) => `<button type="button" data-k="z" data-v="${v}" aria-pressed="false">${t}</button>`).join('')}</span></div>
    <span class="acts">
      <button type="button" class="act" id="ctrl-btn" aria-expanded="true" aria-controls="ctrls" title="Show or hide the controls">${IC.chev}<span>Controls</span></button>
      <button type="button" class="act" id="reload" title="Reload every device">${IC.reload}<span>Reload</span></button>
      <button type="button" class="act" id="notes-btn" aria-expanded="false" aria-controls="notes">${IC.notes}<span>Notes</span></button>
      <button type="button" class="act act-pri" id="phone-btn" aria-expanded="false" aria-controls="phonepop" aria-haspopup="dialog">${IC.phone}<span>On your phone</span></button>
    </span>`;
}
function pressedFor(k, v){
  if (k === 'dev'){
    if (S.view === 'one') return S.dev === v;
    if (S.view === 'fold') return S.fm === 'live' ? v === (S.folded ? 'fold-c' : 'fold-o') : v === 'fold-c' || v === 'fold-o';
    if (S.view === 'ipad') return S.ipad === v;
    return false;
  }
  if (k === 'o' && S.view === 'ipad') return false;   // both orientations are on screen
  return String(S[k]) === v;
}
function syncControls(){
  document.querySelectorAll('[data-k][data-v]').forEach(b => {
    b.setAttribute('aria-pressed', pressedFor(b.dataset.k, b.dataset.v) ? 'true' : 'false');
    if (b.dataset.k === 'o'){ const off = S.view === 'ipad'; b.disabled = off; b.title = off ? 'The iPad view shows portrait and landscape together' : ''; }
  });
  const nb = $('notes-btn'); if (nb) nb.setAttribute('aria-expanded', S.notes ? 'true' : 'false');
  $('ctrls').hidden = S.hc; $('sum').hidden = !S.hc; $('ctrl-btn').setAttribute('aria-expanded', S.hc ? 'false' : 'true');
  if (S.hc) $('sum').innerHTML = summary();
}
function summary(){
  const V = { one: 'One device', all: 'All devices', fold: 'Fold', ipad: 'iPad' }[S.view];
  const dev = S.view === 'one' ? DEVICES[S.dev].name : S.view === 'ipad' ? DEVICES[S.ipad].name : S.view === 'fold' ? 'Galaxy Z Fold7' : 'every device';
  const parts = [S.view === 'ipad' ? 'Portrait and landscape' : S.o === 'l' ? 'Landscape' : 'Portrait', CONTEXTS[S.ctx].label, S.chain === 'stellar' ? 'Stellar' : 'Solana',
    { email: 'Email', wallet: 'Wallet', out: 'Signed out' }[S.auth], S.vm === 'on' ? 'Mascot on' : 'Mascot off', S.mgc === 'on' ? 'Margin chart on' : 'Margin chart off', { locked: 'Copilot locked', unlocked: 'Copilot unlocked', mcp: 'Copilot and MCP open' }[S.cp], S.t === 'dark' ? 'Dark' : 'Light'];
  return `<b>${V}</b>: ${esc(dev)}, ${parts.map(esc).join(', ')}`;
}
function routeSelect(){
  const sel = $('route'); if (!sel) return;
  const known = ROUTES.some(([v]) => v === S.route);
  const want = (known ? '' : S.route) + '|' + S.route;
  if (sel.dataset.state === want) return;
  sel.dataset.state = want;
  sel.innerHTML = ROUTES.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('') + (known ? '' : `<option value="${esc(S.route)}">Now: #${esc(S.route)}</option>`);
  sel.value = S.route;
}
function stageBar(){
  const el = $('subv');
  if (el.dataset.view !== S.view){
    el.dataset.view = S.view;
    let h = '';
    if (S.view === 'all') h = '<span class="hint">Same route, shared scale. Select a name to see it alone.</span>';
    if (S.view === 'fold') h = `<span class="seg" role="group" aria-label="Fold view"><button type="button" data-k="fm" data-v="side" aria-pressed="false">Side by side</button><button type="button" data-k="fm" data-v="live" aria-pressed="false" title="One running app that you fold and unfold: the app is resized, not reloaded, so you can judge state continuity">Live fold</button></span>
      <button type="button" class="act" id="fold-btn">${IC.unfold}<span></span></button><span class="hint" id="fold-hint"></span>`;
    if (S.view === 'ipad') h = '<span class="seg" role="group" aria-label="iPad model"><button type="button" data-k="ipad" data-v="ipad" aria-pressed="false">iPad Air 11</button><button type="button" data-k="ipad" data-v="ipad-pro" aria-pressed="false">iPad Pro 13</button></span><span class="hint">Portrait and landscape together.</span>';
    el.innerHTML = h;
  }
  const fb = $('fold-btn');
  if (fb){
    fb.hidden = S.fm !== 'live';
    fb.querySelector('span').textContent = S.folded ? 'Unfold' : 'Fold';
    $('fold-hint').textContent = S.fm === 'live' ? 'One app instance, resized on unfold.' : 'Closed and open at the same route.';
  }
}

/* ===================== Notes ===================== */
function mascotNote(g){
  if (S.vm === 'off') return 'Mascot off: no chameleon anywhere';
  if (g.id === 'fold-o') return 'Hinge chameleon perches on the hinge line, eyes on the pane last touched. Hidden while a sheet is open or any HF is at or below 1.10';
  if (g.tier === 'short') return 'Decorative placements hidden. One face per screen at the main HF';
  if (g.tier === 'compact') return 'Main HF face in the module hero. One face per screen';
  return 'Account face in the rail or sidebar footer; the hero face hides';
}
function noteCard(fig, open){
  const g = fig._g, t = TIER[g.tier], c = CTXNOTE[g.ctx.id], d = g.d, sa = g.sa;
  const rows = [
    ['Viewport', `${g.vp.w} x ${g.vp.h} CSS px (screen ${g.W} x ${g.H}, DPR ${d.dpr} on the device)`],
    ['Safe areas', `top ${sa.t}, right ${sa.r}, bottom ${sa.b}, left ${sa.l}`],
    ['Tier', `<b class="tier t-${g.tier}">${g.tier}</b> ${t.why}${fig._appTier ? `. App reports <b>${esc(fig._appTier)}</b>` : ''}`],
    ['Navigation', t.nav], ['Pages', t.pages], ['Sheets', t.sheets],
    ['Connect', c.connect], ['Signing', c.sign], ['Must handle', c.handle],
    ['Mascot', mascotNote(g)],
  ];
  if (g.id === 'fold-o') rows.splice(3, 0, ['Fold open', 'Its own composition: two panes split at the hinge (list, detail). Never a stretched phone']);
  const where = `${g.land ? 'Landscape' : 'Portrait'}, ${esc(g.ctx.label)}`;
  return `<details class="nc" data-key="${esc(fig._slot.key)}"${open ? ' open' : ''}><summary><span class="nc-n">${esc(d.name)}</span><span class="nc-w">${where}</span></summary>
    ${g.ctx.note ? `<p class="nc-map">${esc(g.ctx.note)}</p>` : ''}
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}<dt>URL</dt><dd><code>${esc(fig._url || '')}</code></dd></dl></details>`;
}
let notesView = null;
function renderNotes(){
  const el = $('notes');
  const figs = [...FIGS.values()].filter(f => f._g);
  const keep = notesView === lastView ? new Set([...el.querySelectorAll('details[open]')].map(x => x.dataset.key)) : null;
  const scroll = el.scrollTop;
  el.innerHTML = `<div class="notes-h"><h2>Notes</h2><button type="button" class="x" id="notes-x" aria-label="Close notes">${IC.close}</button></div>
    <p class="notes-s">What changes on each device and context (CONTRACT V2.3 and V2.5).</p>${figs.map((f, i) => noteCard(f, keep ? keep.has(f._slot.key) : (S.view !== 'all' || i === 0))).join('')}`;
  el.scrollTop = scroll;
  notesView = lastView;
}

/* ===================== On your phone ===================== */
let qrState = 'idle'; const qrWait = [];
function loadQR(cb){
  if (window.qrcode) return cb();
  qrWait.push(cb);
  if (qrState === 'loading') return;
  qrState = 'loading';
  const s = document.createElement('script');
  s.src = QR_SRC; s.integrity = QR_SRI; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
  s.onload = () => { qrState = window.qrcode ? 'ok' : 'fail'; qrWait.splice(0).forEach(f => f()); };
  s.onerror = () => { qrState = 'fail'; qrWait.splice(0).forEach(f => f()); };
  document.head.appendChild(s);
}
let ppCustom = null;
function defaultPhoneURL(){
  const rel = `${APP}?${qs({ t: S.t, chain: S.chain, auth: S.auth, vm: S.vm, mgchart: S.mgc, cp: S.cp })}${routeHash()}`;
  try { return new URL(rel, location.href).href; } catch (e) { return rel; }
}
function drawQR(url){
  const box = $('pp-qr'); if (!box) return;
  loadQR(() => {
    if (!box.isConnected) return;
    if (!window.qrcode){ box.innerHTML = '<p class="qr-off">The QR code needs an internet connection.</p>'; return; }
    try {
      const qr = window.qrcode(0, 'M'); qr.addData(url); qr.make();
      box.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: 'QR code for the app link' });
    } catch (e) { box.innerHTML = '<p class="qr-off">This link is too long for a QR code.</p>'; }
  });
}
function phoneLink(){
  const url = ppCustom || defaultPhoneURL();
  const inp = $('pp-url'); if (inp && document.activeElement !== inp) inp.value = url;
  const a = $('pp-open'); if (a) a.href = url;
  drawQR(url);
}
function openPhone(){
  const pop = $('phonepop');
  pop.innerHTML = `<div class="pop-h"><h2 id="pp-t">Open on your phone</h2><button type="button" class="x" id="pp-x" aria-label="Close">${IC.close}</button></div>
    <div class="qr" id="pp-qr"><p class="qr-off">Loading the QR code</p></div>
    <label class="pp-l" for="pp-url">Link</label><input id="pp-url" type="url" spellcheck="false" autocomplete="off">
    <div class="pp-a"><button type="button" class="act" id="pp-copy">${IC.copy}<span>Copy link</span></button><a class="act" id="pp-open" target="_blank" rel="noopener">${IC.ext}<span>Open app.html</span></a></div>
    <p class="pp-n">Scan with the camera. The link has no ctx, so the app detects the real browser or wallet.</p>
    ${location.protocol === 'file:' ? '<p class="pp-w">This page is on file://: paste a published or local network link above first.</p>' : ''}`;
  pop.hidden = false;
  placePop();
  $('phone-btn').setAttribute('aria-expanded', 'true');
  phoneLink();
  $('pp-url').focus();
}
function closePhone(refocus){
  const pop = $('phonepop'); if (pop.hidden) return;
  pop.hidden = true; $('phone-btn').setAttribute('aria-expanded', 'false');
  if (refocus) $('phone-btn').focus();
}
function placePop(){
  const pop = $('phonepop'), b = $('phone-btn').getBoundingClientRect(), w = Math.min(320, window.innerWidth - 32);
  pop.style.width = `${w}px`;
  pop.style.top = `${Math.round(b.bottom + 8)}px`;
  pop.style.left = `${Math.round(Math.max(16, Math.min(window.innerWidth - w - 16, b.right - w)))}px`;
}
async function copyLink(){
  const v = $('pp-url').value;
  let ok = false;
  try { await navigator.clipboard.writeText(v); ok = true; } catch (e) {
    try { $('pp-url').select(); ok = document.execCommand('copy'); } catch (e2) {}
  }
  say(ok ? 'Link copied' : 'Copy is blocked here: select the link and copy it');
  const s = $('pp-copy').querySelector('span'); s.textContent = ok ? 'Copied' : 'Copy blocked';
  setTimeout(() => { if (s.isConnected) s.textContent = 'Copy link'; }, 1600);
}
const say = t => { const l = $('live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); };

/* ===================== App frames: read route / tier when same-origin; accept optional messages ===================== */
function readFrame(fig){
  let h = null, tier = null;
  try {
    const w = fig._ifr.contentWindow, de = w.document.documentElement;
    h = decodeURIComponent(w.location.hash.slice(1));
    tier = de.getAttribute('data-tier') || (w.document.body && w.document.body.getAttribute('data-tier')) || null;
  } catch (e) { return; }   // file:// or another origin: the iframe is opaque, nothing to read
  if (tier && TIER[tier] && tier !== fig._appTier){ fig._appTier = tier; refreshCaption(fig); }
  if (h && ROUTE_RE.test(h)) followRoute(fig, h);
}
function followRoute(fig, h){
  if (h === fig._hash) return;
  fig._hash = h;
  if (h === S.route) return;
  S.route = h;
  if (fig._url) fig._url = fig._url.split('#')[0] + routeHash();   // this frame is already there
  writeHash(); render();
}
function refreshCaption(fig){
  if (!fig._g) return;
  fig.querySelector('.cap').innerHTML = capHTML(fig, fig._slot, fig._g);
  if (S.notes) renderNotes();
}
setInterval(() => { FIGS.forEach(f => { if (f._loaded) readFrame(f); }); }, 700);
window.addEventListener('message', e => {
  const m = e.data; if (!m || typeof m !== 'object' || !m.vanna) return;
  const fig = [...FIGS.values()].find(f => f._ifr.contentWindow === e.source); if (!fig) return;
  if (m.vanna === 'route' && typeof m.hash === 'string'){ const h = m.hash.replace(/^#/, ''); if (ROUTE_RE.test(h)) followRoute(fig, h); }
  else if (m.vanna === 'sb' && (m.ink === 'light' || m.ink === 'dark')){ fig._sbInk = m.ink; if (fig._g) fig.querySelector('.dv-chrome').innerHTML = chromeHTML(fig._g, fig); }
  else if (m.vanna === 'tier' && typeof m.tier === 'string' && TIER[m.tier]){ fig._appTier = m.tier; refreshCaption(fig); }
});

/* ===================== Events ===================== */
function set(k, v){
  if (k === 'dev'){
    if (S.view === 'ipad' && DEVICES[v].kind === 'ipad') S.ipad = v;
    else if (S.view === 'fold' && S.fm === 'live' && (v === 'fold-c' || v === 'fold-o')) S.folded = v === 'fold-c';
    else { S.dev = v; S.view = 'one'; }
  } else if (k === 'ctx'){
    S.ctx = v;
    const c = CONTEXTS[v];
    if (c.chain && c.chain !== S.chain) S.chain = c.chain;   // Stellar wallets preselect Stellar, Solana wallets Solana
  } else if (k === 'view'){
    S.view = v;
    if (v === 'ipad' && DEVICES[S.dev].kind === 'ipad') S.ipad = S.dev;
  } else if (k === 'fm'){ S.fm = v; if (v === 'live') S.folded = true; }
  else S[k] = v;
  writeHash(); render();
}
function reloadAll(){
  FIGS.forEach(fig => {
    const n = makeFrame(fig);
    n.style.cssText = fig._ifr.style.cssText; n.title = fig._ifr.title;
    fig._ifr.replaceWith(n); fig._ifr = n; fig._loaded = false; n.src = fig._url;
  });
}
document.addEventListener('click', e => {
  const t = e.target && e.target.closest ? e.target : null; if (!t) return;
  const b = t.closest('[data-k][data-v]');
  if (b && !b.disabled){ set(b.dataset.k, b.dataset.v); return; }
  const fo = t.closest('[data-focus]');
  if (fo){ S.dev = fo.dataset.focus; S.o = fo.dataset.fo || S.o; S.view = 'one'; writeHash(); render(); say(`Showing ${DEVICES[S.dev].name}`); return; }
  if (t.closest('#fold-btn')){
    S.folded = !S.folded; writeHash(); render();
    const fig = FIGS.get('fold:live');
    if (fig){
      fig.classList.add('morph'); setTimeout(() => fig.classList.remove('morph'), 520);
      try { fig._ifr.contentWindow.postMessage({ vanna: 'sa', sa: [fig._g.sa.t, fig._g.sa.r, fig._g.sa.b, fig._g.sa.l] }, '*'); } catch (err) {}
    }
    say(S.folded ? 'Folded: cover screen' : 'Unfolded: inner screen');
    return;
  }
  if (t.closest('#reload')){ reloadAll(); say('Reloaded'); return; }
  if (t.closest('#ctrl-btn')){ S.hc = !S.hc; writeHash(); render(); return; }
  if (t.closest('#notes-btn')){ S.notes = !S.notes; applyNotes(); writeHash(); render(); if (S.notes) $('notes-x').focus(); return; }
  if (t.closest('#notes-x')){ S.notes = false; applyNotes(); writeHash(); render(); $('notes-btn').focus(); return; }
  if (t.closest('#phone-btn')){ if ($('phonepop').hidden) openPhone(); else closePhone(false); return; }
  if (t.closest('#pp-x')){ closePhone(true); return; }
  if (t.closest('#pp-copy')){ copyLink(); return; }
  if (!$('phonepop').hidden && !t.closest('#phonepop')) closePhone(false);
});
document.addEventListener('change', e => {
  if (e.target.id === 'route'){ const v = e.target.value; if (ROUTE_RE.test(v)){ S.route = v; writeHash(); render(); } }
});
let qrTimer = 0;
document.addEventListener('input', e => {
  if (e.target.id !== 'pp-url') return;
  const v = e.target.value.trim(); ppCustom = v || null;
  $('pp-open').href = v || defaultPhoneURL();
  clearTimeout(qrTimer); qrTimer = setTimeout(() => drawQR(v || defaultPhoneURL()), 250);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('phonepop').hidden){ closePhone(true); e.preventDefault(); return; }
  if (S.notes && $('notes').contains(document.activeElement)){ S.notes = false; applyNotes(); writeHash(); render(); $('notes-btn').focus(); }
});
function applyNotes(){ $('notes').hidden = !S.notes; document.body.classList.toggle('with-notes', S.notes); }

let raf = 0;
const refit = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { render(); if (!$('phonepop').hidden) placePop(); }); };
window.addEventListener('resize', refit);
let lastW = 0;
if (window.ResizeObserver){
  new ResizeObserver(en => { const w = Math.round(en[0].contentRect.width); if (w !== lastW){ lastW = w; refit(); } }).observe($('devs'));
  let lastH = 0;
  new ResizeObserver(en => { const h = Math.round(en[0].contentRect.height); if (h !== lastH){ lastH = h; refit(); } }).observe($('strip'));
}
window.addEventListener('hashchange', () => { readHash(); applyNotes(); render(); });

/* ===================== Boot ===================== */
readHash();
buildStrip();
applyNotes();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
window.VannaLab = { S, DEVICES, CONTEXTS, ROUTES, geo, tierOf, render, set };   // for the lab's own checks
})();

</script>
