<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Supply USDC sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,input{font-family:inherit}
@keyframes vdrop{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.drop{transform-origin:top right;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.dropl{transform-origin:top left;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.dropu{transform-origin:bottom center;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.chev{transition:transform 200ms cubic-bezier(.2,.8,.2,1)}
.thumb{transition:left 240ms cubic-bezier(.2,.8,.2,1),width 240ms cubic-bezier(.2,.8,.2,1)}
.opt{transition:background-color 120ms}
.opt:hover{background-color:rgba(127,127,127,.08)}
@media (prefers-reduced-motion: reduce){.drop,.dropl,.dropu{animation:none}.chev,.thumb{transition:none}}
.amt{border:none;outline:none;background:transparent;padding:0;margin:0;min-width:1ch;caret-color:#FC5457;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:center}
.amt::placeholder{color:inherit;opacity:.35}
.tap{transition:background-color 150ms}
@keyframes vsheetup{from{transform:translateY(100%)}to{transform:none}}.sheetup{animation:vsheetup 320ms cubic-bezier(.2,.8,.2,1) both}@media (prefers-reduced-motion: reduce){.sheetup{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; box-sizing: border-box; padding: 48px 20px 0">
    <div style="height: 56px; display: flex; align-items: center; gap: 8px"><span style="width: 24px"></span><img src="/_blob/09e073f5e222ada0320681e7093ff7b4" alt="" style="width: 24px; height: 24px"><span style="font-size: 18px; font-weight: 700">USDC Vault</span></div>
    <div style="padding-top: 24px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; color: {{t.text3}}">Your position</span><span class="m" style="font-size: 40px; font-weight: 700; letter-spacing: -0.04em">2,500.00 <span style="font-size: 16px; font-weight: 500; color: {{t.text3}}">USDC</span></span></div>
  </div>
  <a href="Vault.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: {{t.scrim}}"></a>

  <section role="dialog" aria-label="Supply USDC" class="sheetup" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 20px 28px; border-radius: 24px 24px 0 0; background: {{t.sheet}}; display: flex; flex-direction: column">
    <div style="width: 36px; height: 4px; border-radius: 999px; background: {{t.track}}; align-self: center"></div>
    <div style="height: 52px; margin: 4px -12px 0 0; display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Supply USDC</h2>
      <a href="Vault.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <div style="padding-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <label style="display: flex; justify-content: center; cursor: text"><input class="amt" type="text" inputmode="decimal" autocomplete="off" aria-label="Amount to supply" placeholder="0" value="{{v}}" onInput="{{onAmt}}" onChange="{{onAmt}}" style="width: {{inW}}; height: 64px; font-size: 52px; font-weight: 600; letter-spacing: -0.04em; color: {{amtColor}}"></label>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{t.text3}}"><img src="/_blob/09e073f5e222ada0320681e7093ff7b4" alt="" style="width: 16px; height: 16px">USDC · wallet <span class="m">3,120.55</span></span>
    </div>

    <div style="padding-top: 18px; display: flex; justify-content: center; gap: 8px">
      <sc-for list="{{pcts}}" as="p" hint-placeholder-count="4">
        <button type="button" onClick="{{p.pick}}" class="m tap" style="height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.fieldLine}}; background: transparent; color: {{t.text}}; font-size: 12px; font-weight: 600; cursor: pointer">{{p.label}}</button>
      </sc-for>
    </div>

    <dl style="margin: 28px 0 24px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Supply APY</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600; color: {{t.posText}}">0.69%</dd></div>
      <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Est. yearly earnings</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{yearly}}</dd></div>
      <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Position after</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{after}} USDC</dd></div>
    </dl>



    <a href="Review.dc.html" style="margin-top: 8px; height: 56px; border-radius: 12px; background: {{ctaBg}}; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">{{cta}}</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: '500' };
  }
  tokens() {
    const light = { bg: '#FFFFFF', fieldLine: '#E2E2E2', track: '#E2E2E2', text: '#111111', text3: '#6B7280', grad: 'linear-gradient(135deg, #FC5457 10%, #703AE6 80%)', posText: '#1C7C83', negText: '#B33C3E', disabled: '#BFBFBF', scrim: 'rgba(17,17,17,0.4)', sheet: '#FFFFFF' };
    const dark = { bg: '#111111', fieldLine: '#2C2C2C', track: '#2C2C2C', text: '#FFFFFF', text3: '#949494', grad: 'linear-gradient(135deg, #FC5457 10%, #703AE6 80%)', posText: '#32EEE2', negText: '#FD8C8E', disabled: '#595959', scrim: 'rgba(0,0,0,0.6)', sheet: '#1E1E1E' };
    return (this.props.theme ?? 'light') === 'dark' ? dark : light;
  }
  renderVals() {
    const t = this.tokens();
    const BAL = 3120.55;
    const v = this.state.v;
    const num = parseFloat(v || '0') || 0;
    const over = num > BAL, empty = num === 0;
    const setV = (nv) => this.setState({ v: nv });
    const f2 = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const onAmt = (e) => {
      let x = String(e.target.value).replace(/,/g, '.').replace(/[^0-9.]/g, '');
      const i = x.indexOf('.');
      if (i >= 0) x = x.slice(0, i + 1) + x.slice(i + 1).replace(/\./g, '').slice(0, 2);
      if (x !== this.state.v) this.setState({ v: x });
    };
    const intPart = v.split('.')[0] || '0';
    const dec = v.indexOf('.') >= 0 ? '.' + v.split('.')[1] : '';
    return {
      t: t, onAmt: onAmt, v: v, inW: Math.max(1, (v || '0').length) + 0.2 + 'ch',
      pcts: [['25%', 0.25], ['50%', 0.5], ['75%', 0.75], ['Max', 1]].map(([label, k]) => ({ label: label, pick: () => setV((BAL * k).toFixed(2)) })),
      display: Number(intPart).toLocaleString('en-US') + dec,
      amtColor: over ? t.negText : (empty ? t.text3 : t.text),
      yearly: '+$' + f2(num * 0.0069),
      after: f2(2500 + num),
      ctaBg: empty || over ? t.disabled : t.grad,
      cta: over ? 'Not enough USDC' : (empty ? 'Enter an amount' : 'Review supply')
    };
  }
}
</script>
</body>
</html>
