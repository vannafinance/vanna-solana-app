    <a href="Swap.dc.html" aria-label="Swap" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; text-decoration: none; color: {{t.text3}}">
      <span style="width: 56px; height: 56px; margin-top: -30px; box-sizing: border-box; border-radius: 999px; background: {{t.bg}}; border: 1px solid {{t.fieldLine}}; box-shadow: 0 6px 18px rgba(17,17,17,0.18); display: flex; align-items: center; justify-content: center"><img src="/_blob/e9a4dc2e42d01dc076173579d6188f36" alt="" style="width: 30px; height: 30px"></span>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

    const dark = { word: '/_blob/9522abd43bbe6600df610e270423ff6c', bg: '#111111', fill: '#1E1E1E', fieldLine: '#2C2C2C', track: '#2C2C2C', line: 'rgba(255,255,255,0.08)', text: '#FFFFFF', text2: '#BFBFBF', text3: '#949494', onInk: '#111111', grad: 'linear-gradient(135deg, #FC5457 10%, #703AE6 80%)', pos: '#32EEE2', posText: '#32EEE2', long: '#32EEE2', short: '#FC5457', negText: '#FD8C8E', disabled: '#595959', scrim: 'rgba(0,0,0,0.6)', sheet: '#1E1E1E', navGlass: 'rgba(30,30,30,0.66)', navLine: 'rgba(255,255,255,0.08)', fade: 'linear-gradient(to top, rgba(17,17,17,0.9) 0%, rgba(17,17,17,0.55) 45%, rgba(17,17,17,0) 100%)', shadow: '0 12px 32px rgba(0,0,0,0.5)' };

    const all = [

    const f = this.state.filter, q = this.state.q.trim().toLowerCase();
    const list = all.filter((v) => (f === 'All' || v.kind === f) && (!q || v.sym.toLowerCase().indexOf(q) >= 0));
    const mine = list.filter((v) => v.mine), rest = list.filter((v) => !v.mine);
    const groups = [];
    if (mine.length) groups.push({ title: 'YOUR VAULTS', items: mine });
    if (rest.length) groups.push({ title: mine.length ? 'MORE VAULTS' : 'ALL VAULTS', items: rest });
    return {
      t: t, q: this.state.q, groups: groups, none: list.length === 0,
      onQ: (e) => this.setState({ q: e.target.value }),
