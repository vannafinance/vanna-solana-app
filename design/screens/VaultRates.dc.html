<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>USDC Vault · rates first</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,input{font-family:inherit}
@keyframes vsheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet{animation:vsheet 220ms ease-out both}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="position: absolute; left: 0; right: 0; top: 48px; height: 56px; padding: 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="Earn.dc.html" aria-label="Back to Earn" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.text}}; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    </a>
    <img src="/_blob/09e073f5e222ada0320681e7093ff7b4" alt="" style="width: 24px; height: 24px">
    <h1 style="margin: 0 0 0 4px; font-size: 18px; font-weight: 700">USDC Vault</h1>
  </header>

  <div style="box-sizing: border-box; padding: 128px 20px 0; display: flex; flex-direction: column">
    <sc-if value="{{posFirst}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Your position" style="padding-bottom: 36px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; color: {{t.text3}}">Your position</span>
        <span class="m" style="font-size: 36px; line-height: 44px; font-weight: 600; letter-spacing: -0.03em">2,500.00 <span style="font-size: 16px; font-weight: 500; color: {{t.text3}}">USDC</span></span>
        <span class="m" style="font-size: 14px; color: {{t.posText}}">+$17.25 / yr</span>
      </section>
    </sc-if>

    <section aria-label="Rates" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: {{t.text3}}">Supply APY</span>
        <span class="m" style="font-size: {{rateSize}}; line-height: 1.2; font-weight: 600; letter-spacing: -0.03em; color: {{t.posText}}">0.69%</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: {{t.text3}}">Borrow APY</span>
        <span class="m" style="font-size: {{rateSize}}; line-height: 1.2; font-weight: 600; letter-spacing: -0.03em">2.93%</span>
      </div>
    </section>

    <section aria-label="Utilization" style="padding-top: 24px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: {{t.text3}}">Utilization</span><span class="m" style="font-weight: 600">23.45%</span></div>
      <div role="progressbar" aria-valuenow="23.45" aria-valuemin="0" aria-valuemax="100" aria-label="Utilization" style="height: 4px; border-radius: 2px; background: {{t.track}}; position: relative"><div style="position: absolute; left: 0; top: 0; bottom: 0; width: 23.45%; border-radius: 2px; background: {{t.text}}"></div></div>
    </section>

    <sc-if value="{{posAfter}}" hint-placeholder-val="{{ true }}">
      <section aria-label="Your position" style="padding-top: 40px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: {{t.text3}}">Your position</span>
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span class="m" style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em">2,500.00 <span style="font-size: 14px; font-weight: 500; color: {{t.text3}}">USDC</span></span>
          <span class="m" style="font-size: 13px; color: {{t.posText}}">+$17.25 / yr</span>
        </div>
      </section>
    </sc-if>

    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 40px 0 0; font-size: 15px; line-height: 22px; color: {{t.text2}}">You haven't supplied USDC yet.</p>
    </sc-if>

    <button type="button" onClick="{{openSheet}}" aria-haspopup="dialog" style="margin-top: 28px; margin-right: -8px; height: 48px; padding: 0; border: none; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; cursor: pointer">
      Pool details
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: {{t.text3}}"><path d="m9 6 6 6-6 6"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 32px; background: {{t.bg}}; display: flex; gap: 12px">
    <sc-if value="{{hasPos}}" hint-placeholder-val="{{ true }}">
      <a href="SupplySheet.dc.html" style="flex: 1; height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.fieldLine}}; color: {{t.text}}; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Withdraw</a>
    </sc-if>
    <a href="SupplySheet.dc.html" style="flex: 1; height: 52px; border-radius: 12px; background: {{t.grad}}; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">{{supplyLabel}}</a>
  </div>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{closeSheet}}" aria-label="Close pool details" style="position: absolute; inset: 0; padding: 0; border: none; background: {{t.scrim}}; cursor: pointer"></button>
    <section role="dialog" aria-label="{{sheetTitle}}" class="sheet" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 20px 36px; border-radius: 24px 24px 0 0; background: {{t.sheet}}; display: flex; flex-direction: column">
      <div style="width: 36px; height: 4px; border-radius: 999px; background: {{t.track}}; align-self: center"></div>
      <div style="height: 56px; margin: 4px -12px 0; display: flex; align-items: center; gap: 4px">
        <sc-if value="{{isSub}}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{toMain}}" aria-label="Back to pool details" style="width: 48px; height: 48px; padding: 0; border: none; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg></button>
        </sc-if>
        <h2 style="margin: 0; padding-left: {{titlePad}}; flex-grow: 1; font-size: 17px; font-weight: 700">{{sheetTitle}}</h2>
        <button type="button" onClick="{{closeSheet}}" aria-label="Close" style="width: 48px; height: 48px; padding: 0; border: none; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
      </div>

      <sc-if value="{{hasRows}}" hint-placeholder-val="{{ true }}">
        <dl style="margin: 8px 0 0; display: flex; flex-direction: column; gap: 18px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px"><dt style="font-size: 14px; color: {{t.text3}}">{{r.k}}</dt><dd style="margin: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span class="m" style="font-size: 14px; font-weight: 600; color: {{r.c}}">{{r.v}}</span><span class="m" style="font-size: 11px; color: {{t.text3}}">{{r.sub}}</span></dd></div>
          </sc-for>
        </dl>
      </sc-if>

      <sc-if value="{{isMain}}" hint-placeholder-val="{{ true }}">
        <nav aria-label="More pool information" style="margin: 24px -8px 0 0; display: flex; flex-direction: column">
          <sc-for list="{{links}}" as="l" hint-placeholder-count="3">
            <button type="button" onClick="{{l.go}}" style="height: 52px; padding: 0; border: none; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; cursor: pointer">{{l.label}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: {{t.text3}}"><path d="m9 6 6 6-6 6"></path></svg></button>
          </sc-for>
        </nav>
      </sc-if>

      <sc-if value="{{isProtocol}}" hint-placeholder-val="{{ false }}">
        <ul style="margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column">
          <sc-for list="{{contracts}}" as="c" hint-placeholder-count="6">
            <li style="min-height: 56px; display: flex; align-items: center; gap: 4px">
              <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: {{t.text3}}">{{c.k}}</span><span class="m" style="font-size: 14px; font-weight: 600">{{c.v}}</span></span>
              <button type="button" aria-label="Copy {{c.k}} address" style="width: 44px; height: 44px; padding: 0; border: none; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg></button>
              <a href="https://explorer.solana.com" aria-label="Open {{c.k}} in explorer" style="width: 44px; height: 44px; margin-right: -12px; color: {{t.text2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4 10 14"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a>
            </li>
          </sc-for>
        </ul>
      </sc-if>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"layout":{"editor":"enum","options":["Position first","Rates first","No position"],"default":"Rates first"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: '' };
  }
  tokens() {
    const light = { bg: '#FFFFFF', fieldLine: '#E2E2E2', track: '#E2E2E2', text: '#111111', text2: '#4B5563', text3: '#6B7280', grad: 'linear-gradient(135deg, #FC5457 10%, #703AE6 80%)', pos: '#32EEE2', posText: '#1C7C83', scrim: 'rgba(17,17,17,0.4)', sheet: '#FFFFFF' };
    const dark = { bg: '#111111', fieldLine: '#2C2C2C', track: '#2C2C2C', text: '#FFFFFF', text2: '#BFBFBF', text3: '#949494', grad: 'linear-gradient(135deg, #FC5457 10%, #703AE6 80%)', pos: '#32EEE2', posText: '#32EEE2', scrim: 'rgba(0,0,0,0.6)', sheet: '#1E1E1E' };
    return (this.props.theme ?? 'light') === 'dark' ? dark : light;
  }
  renderVals() {
    const t = this.tokens();
    const layout = this.props.layout ?? 'Rates first';
    const hasPos = layout !== 'No position';
    const posFirst = layout === 'Position first';
    const sh = this.state.sheet;
    const go = (s) => () => this.setState({ sheet: s });
    const row = (k, v, sub, c) => ({ k: k, v: v, sub: sub || '', c: c || t.text });
    const content = {
      main: { title: 'Pool details', rows: [row('Total supplied', '$96.03K'), row('Total borrowed', '$22.52K'), row('Available liquidity', '$73.51K'), row('Utilization', '23.45%')] },
      apy: { title: 'APY details', rows: [row('Base APY', '0.41%'), row('Bonus APY', '0.07%'), row('Rewards APY', '0.21%'), row('Current APY', '0.69%', '', t.posText), row('Projected earnings', '$1.44 / mo', '$17.25 / yr on your 2,500 USDC')] },
      risk: { title: 'Risk & parameters', rows: [row('Oracle price', '$0.9998', 'USDC / USD'), row('Liquidation penalty', 'Dynamic', '0–15%'), row('Share token rate', '1.0003514', 'USDC per vUSDC')] },
      protocol: { title: 'Protocol details', rows: [] }
    };
    const cur = content[sh] || content.main;
    return {
      t: t,
      posFirst: posFirst, posAfter: hasPos && !posFirst, empty: !hasPos, hasPos: hasPos,
      rateSize: posFirst ? '28px' : '36px',
      supplyLabel: hasPos ? 'Supply' : 'Supply USDC',
      sheetOpen: sh !== '',
      openSheet: go('main'), closeSheet: go(''), toMain: go('main'),
      isMain: sh === 'main', isSub: sh !== 'main' && sh !== '', isProtocol: sh === 'protocol',
      hasRows: cur.rows.length > 0,
      titlePad: sh === 'main' ? '12px' : '0',
      sheetTitle: cur.title, rows: cur.rows,
      links: [{ label: 'APY details', go: go('apy') }, { label: 'Risk & parameters', go: go('risk') }, { label: 'Protocol details', go: go('protocol') }],
      contracts: [
        { k: 'vUSDC token', v: '6AzITN…RPKr' },
        { k: 'USDC lending protocol', v: 'BWebs8…KUGJ' },
        { k: 'Risk engine', v: 'BZ812n…H3Zg' },
        { k: 'Oracle contract', v: 'BZ812n…H3Zg' },
        { k: 'Interest rate model', v: 'BZ812n…H3Zg' },
        { k: 'Registry contract', v: 'BZ812n…H3Zg' }
      ]
    };
  }
}
</script>
</body>
</html>
