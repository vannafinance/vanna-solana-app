<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,input{font-family:inherit}
input::placeholder{color:#8A8F98}
@keyframes vup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.up{animation:vup 220ms ease-out both}
@media (prefers-reduced-motion: reduce){.up{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; box-sizing: border-box; padding: 60px 20px 0; opacity: 0.5">
    <span style="font-size: 17px; font-weight: 700">TSLAx-USDC</span>
  </div>
  <a href="Perps.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: {{t.scrim}}"></a>

  <section role="dialog" aria-label="Choose a market" class="up" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; border-radius: 24px 24px 0 0; background: {{t.sheet}}; overflow: hidden">
    <div style="position: absolute; inset: 0; overflow-y: auto; box-sizing: border-box; padding: 8px 20px 110px">
      <div style="width: 36px; height: 4px; margin: 0 auto; border-radius: 999px; background: {{t.track}}"></div>
      <div style="height: 52px; margin: 4px -12px 0 0; display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Markets</h2>
        <a href="Perps.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.text}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      </div>
      <div role="tablist" aria-label="Sort" style="display: flex; gap: 18px">
        <sc-for list="{{sorts}}" as="o" hint-placeholder-count="3">
          <button type="button" role="tab" onClick="{{o.pick}}" aria-selected="{{o.on}}" style="height: 40px; padding: 0; border: none; background: transparent; color: {{o.fg}}; font-size: 13px; font-weight: {{o.w}}; cursor: pointer">{{o.label}}</button>
        </sc-for>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section aria-label="{{g.title}}" style="padding-top: 14px; display: flex; flex-direction: column">
          <span style="height: 28px; display: flex; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: {{t.text3}}">{{g.title}}</span>
          <sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
            <a href="Perps.dc.html" style="min-height: 64px; margin: 0 -12px; padding: 0 12px; border-radius: 12px; background: {{r.bg}}; display: flex; align-items: center; gap: 12px; text-decoration: none; color: {{t.text}}">
              <img src="{{r.icon}}" alt="" style="width: 40px; height: 40px; border-radius: 999px">
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 700">{{r.sym}}</span><span style="font-size: 12px; color: {{t.text3}}">{{r.name}} · {{r.liq}} liquidity</span></span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px"><span class="m" style="font-size: 15px; font-weight: 600">{{r.price}}</span><span class="m" style="font-size: 12px; color: {{r.c}}">{{r.chg}}</span></span>
            </a>
          </sc-for>
        </section>
      </sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><p style="margin: 28px 0 0; font-size: 14px; color: {{t.text3}}">No markets match “{{q}}”.</p></sc-if>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; background: {{t.fade}}"></div>
    <label style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; background: {{t.navGlass}}; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid {{t.navLine}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; gap: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: {{t.text3}}"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search markets</span>
      <input type="text" value="{{q}}" onInput="{{onQ}}" placeholder="Search markets" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; color: {{t.text}}; font-size: 15px">
    </label>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', sort: 'Liquidity' };
  }
  tokens() {
    const light = { word: '/_blob/a759693c94ec9c77db2dda762f77b416', bg: '#FFFFFF', fill: '#F4F4F4', fieldLine: '#E2E2E2', track: '#E2E2E2', line: 'rgba(17,17,17,0.08)', text: '#111111', text2: '#4B5563', text3: '#6B7280', onInk: '#FFFFFF', grad: 'linear-gradient(135deg, #FC5457 10%, #703AE6 80%)', pos: '#32EEE2', posText: '#1C7C83', long: '#32EEE2', short: '#FC5457', negText: '#B33C3E', disabled: '#BFBFBF', scrim: 'rgba(17,17,17,0.4)', sheet: '#FFFFFF', navGlass: 'rgba(255,255,255,0.72)', navLine: 'rgba(17,17,17,0.08)', fade: 'linear-gradient(to top, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0) 100%)', shadow: '0px 7px 15px rgba(0,0,0,0.08), 0px 28px 28px rgba(0,0,0,0.07)' };
    const dark = { word: '/_blob/9522abd43bbe6600df610e270423ff6c', bg: '#111111', fill: '#1E1E1E', fieldLine: '#2C2C2C', track: '#2C2C2C', line: 'rgba(255,255,255,0.08)', text: '#FFFFFF', text2: '#BFBFBF', text3: '#949494', onInk: '#111111', grad: 'linear-gradient(135deg, #FC5457 10%, #703AE6 80%)', pos: '#32EEE2', posText: '#32EEE2', long: '#32EEE2', short: '#FC5457', negText: '#FD8C8E', disabled: '#595959', scrim: 'rgba(0,0,0,0.6)', sheet: '#1E1E1E', navGlass: 'rgba(30,30,30,0.66)', navLine: 'rgba(255,255,255,0.08)', fade: 'linear-gradient(to top, rgba(17,17,17,0.9) 0%, rgba(17,17,17,0.55) 45%, rgba(17,17,17,0) 100%)', shadow: '0 12px 32px rgba(0,0,0,0.5)' };
    return (this.props.theme ?? 'light') === 'dark' ? dark : light;
  }
  renderVals() {
    const t = this.tokens();
    const all = [
      { sym: 'TSLAx', kind: 'xStock', name: 'Tesla', icon: '/_blob/1e343423a63e8d1e43c4f214a310e96d', liq: '$266K', l: 266, price: '$368.44', chg: '+2.01%', ch: 2.01, sel: true },
      { sym: 'GOOGLx', kind: 'xStock', name: 'Alphabet', icon: '/_blob/d559c7641fca79fb89e54a04d076d4ce', liq: '$123K', l: 123, price: '$175.00', chg: '−0.62%', ch: -0.62 },
      { sym: 'AAPLx', kind: 'xStock', name: 'Apple', icon: '/_blob/dc98bc7b4f6f28441bd08bdda1a2a3b2', liq: '$26K', l: 26, price: '$340.00', chg: '+0.41%', ch: 0.41 },
      { sym: 'SOL', kind: 'Crypto', name: 'Solana', icon: '/_blob/4fda11b4a30f7ec1c38590238e643cfa', liq: '$88K', l: 88, price: '$100.00', chg: '+3.12%', ch: 3.12 },
      { sym: 'ANTHROPIC', kind: 'PreStock', name: 'Anthropic', icon: '/_blob/791878a119219bc4f9e4c9fa3f0b1205', liq: '$8.9K', l: 8.9, price: '$1.00', chg: '0.00%', ch: 0 },
      { sym: 'OPENAI', kind: 'PreStock', name: 'OpenAI', icon: '/_blob/daec0a70a9ead187c42ece697ccf239a', liq: '$8.8K', l: 8.8, price: '$1.00', chg: '0.00%', ch: 0 }
    ];
    const q = this.state.q.trim().toLowerCase(), sort = this.state.sort;
    let list = all.filter((r) => !q || (r.sym + ' ' + r.name).toLowerCase().indexOf(q) >= 0);
    list = list.slice().sort((a, b) => sort === 'Liquidity' ? b.l - a.l : (sort === 'Top movers' ? Math.abs(b.ch) - Math.abs(a.ch) : a.sym.localeCompare(b.sym)));
    const dec = (r) => Object.assign({}, r, { bg: r.sel ? t.fill : 'transparent', c: r.ch > 0 ? t.posText : (r.ch < 0 ? t.negText : t.text3) });
    const groups = [['XSTOCKS', 'xStock'], ['CRYPTO', 'Crypto'], ['PRESTOCKS', 'PreStock']].map(([title, k]) => ({ title: title, items: list.filter((r) => r.kind === k).map(dec) })).filter((g) => g.items.length);
    return {
      t: t, q: this.state.q, groups: groups, none: list.length === 0,
      onQ: (e) => this.setState({ q: e.target.value }),
      sorts: ['Liquidity', 'Top movers', 'A–Z'].map((label) => ({ label: label, on: sort === label ? 'true' : 'false', fg: sort === label ? t.text : t.text3, w: sort === label ? 700 : 500, pick: () => this.setState({ sort: label }) }))
    };
  }
}
</script>
</body>
</html>
