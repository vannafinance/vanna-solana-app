<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile and settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,input{font-family:inherit}
@keyframes vdrop{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.drop{transform-origin:top right;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.dropl{transform-origin:top left;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.dropu{transform-origin:bottom center;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.chev{transition:transform 200ms cubic-bezier(.2,.8,.2,1)}
.thumb{transition:left 240ms cubic-bezier(.2,.8,.2,1),width 240ms cubic-bezier(.2,.8,.2,1)}
.opt{transition:background-color 120ms}
.opt:hover{background-color:rgba(127,127,127,.08)}
@media (prefers-reduced-motion: reduce){.drop,.dropl,.dropu{animation:none}.chev,.thumb{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow-y: auto; box-sizing: border-box; padding: 48px 16px 28px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="height: 56px; margin: 0 -12px; display: flex; align-items: center; gap: 4px">
    <a href="HomeB.dc.html" aria-label="Back to Portfolio" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 700">Profile &amp; settings</h1>
  </header>

  <section aria-label="Wallet" style="padding: 16px 0 18px; display: flex; align-items: center; gap: 14px">
    <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><clipPath id="avs"><circle cx="16" cy="16" r="16"></circle></clipPath><g clip-path="url(#avs)"><rect width="32" height="32" fill="#E6E6E6"></rect><rect x="0" y="0" width="8" height="8" fill="#111111"></rect><rect x="24" y="0" width="8" height="8" fill="#111111"></rect><rect x="8" y="8" width="16" height="8" fill="#FC5457"></rect><rect x="0" y="16" width="8" height="8" fill="#8C8C8C"></rect><rect x="24" y="16" width="8" height="8" fill="#8C8C8C"></rect><rect x="8" y="24" width="16" height="8" fill="#111111"></rect></g></svg>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <span class="m" style="font-size: 16px; font-weight: 600">7xKp8Vd2…mQh94fQ2</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{t.text2}}"><img src="/_blob/02c61c845398e2f930049e782b776b8c" alt="" style="width: 16px; height: 16px; border-radius: 4px">Backpack · connected</span>
    </div>
  </section>
  <div style="height: 48px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid {{t.line}}; border-bottom: 1px solid {{t.line}}">
    <button type="button" onClick="{{copy}}" style="border: none; border-right: 1px solid {{t.line}}; background: transparent; color: {{t.text}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>{{copyLabel}}
    </button>
    <a href="https://explorer.solana.com" style="color: {{t.text}}; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4 10 14"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>Explorer
    </a>
  </div>

  <div style="padding: 24px 0 4px; display: flex; align-items: center; justify-content: space-between">
    <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: {{t.text3}}">WATCHLIST</h2>
    <a href="Markets.dc.html" style="height: 32px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: {{t.text}}; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add</a>
  </div>
  <sc-for list="{{watch}}" as="w" hint-placeholder-count="3">
    <div style="min-height: 60px; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto 40px; column-gap: 12px; align-items: center; border-bottom: 1px solid {{t.line}}">
      <img src="{{w.icon}}" alt="" style="width: 32px; height: 32px; border-radius: 999px">
      <a href="Perps.dc.html" style="min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: {{t.text}}"><span style="font-size: 15px; font-weight: 600">{{w.sym}}</span><span style="font-size: 12px; color: {{t.text3}}">{{w.sub}}</span></a>
      <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span class="m" style="font-size: 15px; font-weight: 600">{{w.price}}</span><span class="m" style="font-size: 12px; color: {{w.c}}">{{w.chg}}</span></span>
      <button type="button" onClick="{{w.toggle}}" aria-pressed="{{w.onA}}" aria-label="{{w.aria}}" style="width: 40px; height: 40px; margin-right: -8px; padding: 0; border: none; background: transparent; color: {{w.star}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{w.fill}}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></button>
    </div>
  </sc-for>

  <h2 style="margin: 0; padding: 24px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: {{t.text3}}">GENERAL</h2>
  <div style="position: relative; border-bottom: 1px solid {{t.line}}">
    <button type="button" onClick="{{toggleTheme}}" aria-haspopup="listbox" aria-expanded="{{themeOpen}}" style="width: 100%; height: 56px; padding: 0; border: none; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
      <span style="font-size: 15px">Theme</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600">{{mode}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="chev" style="color: {{t.text3}}; transform: {{chev}}"><path d="m6 9 6 6 6-6"></path></svg></span>
    </button>
    <sc-if value="{{showTheme}}" hint-placeholder-val="{{ false }}">
      <ul role="listbox" aria-label="Theme" class="drop" style="position: absolute; right: 0; top: 52px; z-index: 2; margin: 0; list-style: none; width: 200px; padding: 6px; box-sizing: border-box; border-radius: 14px; border: 1px solid {{t.fieldLine}}; background: {{t.menu}}; box-shadow: {{t.shadow}}">
        <sc-for list="{{modes}}" as="a" hint-placeholder-count="3">
          <li role="option" aria-selected="{{a.on}}" style="display: flex">
            <button type="button" class="opt" onClick="{{a.pick}}" style="flex-grow: 1; height: 48px; padding: 0 10px; border-radius: 10px; border: none; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: {{a.w}}; cursor: pointer">{{a.label}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="opacity: {{a.check}}"><path d="m5 12 5 5 9-10"></path></svg></button>
          </li>
        </sc-for>
      </ul>
    </sc-if>
  </div>
  <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{t.line}}"><span style="font-size: 15px">Network</span><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 999px; background: {{t.pos}}"></span>Vanna Devnet</span></div>
  <div style="height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid {{t.line}}"><span style="font-size: 15px">RPC</span><span class="m" style="min-width: 0; font-size: 12px; color: {{t.text2}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">rpc-devnet.solana.vanna.finance</span></div>

  <h2 style="margin: 0; padding: 24px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: {{t.text3}}">ABOUT</h2>
  <a href="https://docs.solana.vanna.finance" style="height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{t.line}}; text-decoration: none; color: {{t.text}}"><span style="font-size: 15px">Docs &amp; guides</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: {{t.text3}}"><path d="m9 6 6 6-6 6"></path></svg></a>
  <a href="https://vanna.finance" style="height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{t.line}}; text-decoration: none; color: {{t.text}}"><span style="font-size: 15px">Terms &amp; privacy</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: {{t.text3}}"><path d="m9 6 6 6-6 6"></path></svg></a>

  <div style="flex-grow: 1"></div>
  <a href="Main.dc.html" style="height: 52px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.fieldLine}}; color: {{t.negText}}; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Disconnect wallet</a>
  <span class="m" style="padding-top: 12px; text-align: center; font-size: 11px; color: {{t.text3}}">Vanna mobile 0.1.0 · devnet</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'System', open: false, copied: false, off: {} };
  }
  tokens() {
    const light = { theme: 'light', bg: '#FFFFFF', fieldLine: '#E2E2E2', line: 'rgba(17,17,17,0.08)', text: '#111111', text2: '#4B5563', text3: '#6B7280', pos: '#32EEE2', negText: '#B33C3E', menu: '#FFFFFF', posText: '#1C7C83', shadow: '0px 7px 15px rgba(0,0,0,0.08), 0px 28px 28px rgba(0,0,0,0.07)' };
    const dark = { theme: 'dark', bg: '#1E1E1E', fieldLine: '#2C2C2C', line: 'rgba(255,255,255,0.08)', text: '#FFFFFF', text2: '#BFBFBF', text3: '#949494', pos: '#32EEE2', negText: '#FD8C8E', menu: '#1E1E1E', posText: '#32EEE2', shadow: '0 12px 32px rgba(0,0,0,0.5)' };
    const d = (this.props.theme ?? 'light') === 'dark' ? dark : light;
    return d.theme === 'dark' ? Object.assign({}, d, { bg: '#111111' }) : d;
  }
  renderVals() {
    const t = this.tokens();
    const st = this.state;
    return {
      t: t,
      mode: st.mode,
      showTheme: st.open,
      themeOpen: st.open ? 'true' : 'false',
      chev: st.open ? 'rotate(180deg)' : 'none',
      toggleTheme: () => this.setState({ open: !st.open }),
      modes: ['Light', 'Dark', 'System default'].map((m) => {
        const key = m === 'System default' ? 'System' : m;
        const on = st.mode === key;
        return { label: m, on: on ? 'true' : 'false', w: on ? 700 : 500, check: on ? 1 : 0, pick: () => this.setState({ mode: key, open: false }) };
      }),
      watch: [['TSLAx', 'xStock', '$368.44', '+2.10%', '/_blob/1e343423a63e8d1e43c4f214a310e96d', true], ['GOOGLx', 'xStock', '$175.00', '−0.42%', '/_blob/d559c7641fca79fb89e54a04d076d4ce', false], ['ANTHROPIC', 'PreStock', '$1.00', '0.00%', '/_blob/791878a119219bc4f9e4c9fa3f0b1205', null]].map(([sym, sub, price, chg, icon, up]) => {
        const on = !st.off[sym];
        return { sym: sym, sub: sub, price: price, chg: chg, icon: icon, c: up === true ? t.posText : (up === false ? t.negText : t.text3), onA: on ? 'true' : 'false', aria: on ? 'Remove ' + sym + ' from watchlist' : 'Add ' + sym + ' to watchlist', star: on ? t.text : t.text3, fill: on ? 'currentColor' : 'none', toggle: () => this.setState({ off: Object.assign({}, st.off, { [sym]: on }) }) };
      }),
      copyLabel: st.copied ? 'Copied' : 'Copy address',
      copy: () => this.setState({ copied: true })
    };
  }
}
</script>
</body>
</html>
