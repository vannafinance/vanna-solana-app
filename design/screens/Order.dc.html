<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Perps order ticket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.m{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,input{font-family:inherit}
@keyframes vdrop{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
.drop{transform-origin:top right;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.dropl{transform-origin:top left;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.dropu{transform-origin:bottom center;animation:vdrop 180ms cubic-bezier(.2,.8,.2,1) both}
.chev{transition:transform 200ms cubic-bezier(.2,.8,.2,1)}
.thumb{transition:left 240ms cubic-bezier(.2,.8,.2,1),width 240ms cubic-bezier(.2,.8,.2,1)}
.opt{transition:background-color 120ms}
.opt:hover{background-color:rgba(127,127,127,.08)}
@media (prefers-reduced-motion: reduce){.drop,.dropl,.dropu{animation:none}.chev,.thumb{transition:none}}
.amt{border:none;outline:none;background:transparent;padding:0;margin:0;min-width:1ch;caret-color:#FC5457;font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:center}
.amt::placeholder{color:inherit;opacity:.35}
.tap{transition:background-color 150ms}
@keyframes vsheetup{from{transform:translateY(100%)}to{transform:none}}.sheetup{animation:vsheetup 320ms cubic-bezier(.2,.8,.2,1) both}@media (prefers-reduced-motion: reduce){.sheetup{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 48px 0 24px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="height: 56px; padding: 0 4px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="Perps.dc.html" aria-label="Back to market" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.text}}; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    </a>
    <img src="/_blob/1e343423a63e8d1e43c4f214a310e96d" alt="" style="width: 24px; height: 24px; border-radius: 999px">
    <span style="flex-grow: 1; font-size: 17px; font-weight: 700">TSLAx-USDC</span>
    <span class="m" style="padding-right: 16px; font-size: 14px; font-weight: 600">$368.44</span>
  </header>

  <div role="tablist" aria-label="Direction" style="margin: 4px 16px 0; padding: 4px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; border-radius: 14px; background: {{t.fill}}; flex-shrink: 0">
    <button type="button" role="tab" onClick="{{goLong}}" aria-selected="{{longSel}}" style="height: 44px; padding: 0; border: none; border-radius: 10px; background: {{longBg}}; color: {{longFg}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 700; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>Long
    </button>
    <button type="button" role="tab" onClick="{{goShort}}" aria-selected="{{shortSel}}" style="height: 44px; padding: 0; border: none; border-radius: 10px; background: {{shortBg}}; color: {{shortFg}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 700; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10"></path><path d="M17 8v9H8"></path></svg>Short
    </button>
  </div>

  <section aria-label="Amount" style="padding: 36px 16px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0">
    <label class="m" style="display: flex; align-items: center; justify-content: center; font-size: 52px; line-height: 64px; font-weight: 600; letter-spacing: -0.04em; color: {{amtColor}}; cursor: text">$<input class="amt" type="text" inputmode="decimal" autocomplete="off" aria-label="Amount in USDC" placeholder="0" value="{{v}}" onInput="{{onAmt}}" onChange="{{onAmt}}" style="text-align: left; width: {{inW}}; height: 64px; font-size: 52px; font-weight: 600; letter-spacing: -0.04em; color: inherit"></label>
    <span class="m" style="font-size: 13px; color: {{t.text3}}">{{size}} position · {{units}} TSLAx</span>
  </section>
  <div style="padding: 12px 16px 0; display: flex; justify-content: center; gap: 8px; flex-shrink: 0">
    <sc-for list="{{pcts}}" as="p" hint-placeholder-count="4">
      <button type="button" onClick="{{p.pick}}" class="m tap" style="height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.fieldLine}}; background: transparent; color: {{t.text}}; font-size: 12px; font-weight: 600; cursor: pointer">{{p.label}}</button>
    </sc-for>
  </div>

  <div style="margin: 18px 16px 0; display: flex; flex-direction: column; flex-shrink: 0">
    <button type="button" style="height: 48px; padding: 0; border: none; background: transparent; color: {{t.text}}; display: flex; align-items: center; gap: 10px; cursor: pointer">
      <img src="/_blob/09e073f5e222ada0320681e7093ff7b4" alt="" style="width: 24px; height: 24px">
      <span style="flex-grow: 1; text-align: left; font-size: 14px">Pay with <span style="font-weight: 700">USDC</span></span>
      <span class="m" style="font-size: 13px; color: {{t.text3}}">3,120.55</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color: {{t.text3}}"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div style="height: 48px; display: flex; align-items: center; gap: 8px">
      <button type="button" onClick="{{openLev}}" aria-haspopup="dialog" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.fieldLine}}; background: transparent; color: {{t.text}}; display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer">Leverage <span class="m" style="font-weight: 700">{{lev}}×</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button type="button" onClick="{{toggleType}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.fieldLine}}; background: transparent; color: {{t.text}}; display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer">{{otype}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <sc-if value="{{isLimit}}" hint-placeholder-val="{{ false }}">
      <div style="height: 40px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 13px; color: {{t.text3}}">Limit price</span><span class="m" style="font-size: 14px; font-weight: 600">$360.00</span></div>
    </sc-if>
  </div>

  <dl style="margin: 8px 16px 0; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
    <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Position size</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{size}}</dd></div>
    <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Borrowed from pool</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{borrowed}}</dd></div>
    <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Liquidation price</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{liq}}</dd></div>
    <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Trading fee</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{fee}}</dd></div>
  </dl>
  <div style="flex-grow: 1"></div>

  <div style="padding: 6px 16px 0; flex-shrink: 0">
    <a href="Review.dc.html" style="height: 56px; border-radius: 12px; background: {{ctaBg}}; color: {{ctaFg}}; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">{{cta}}</a>
  </div>
  <sc-if value="{{levOpen}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{closeLev}}" aria-label="Close leverage" style="position: absolute; inset: 0; padding: 0; border: none; background: {{t.scrim}}; cursor: pointer"></button>
    <section role="dialog" aria-label="Leverage" class="sheetup" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 20px 28px; border-radius: 24px 24px 0 0; background: {{t.sheet}}; display: flex; flex-direction: column">
      <div style="width: 36px; height: 4px; border-radius: 999px; background: {{t.fieldLine}}; align-self: center"></div>
      <h2 style="margin: 16px 0 0; font-size: 17px; font-weight: 700">Leverage</h2>
      <span class="m" style="margin-top: 16px; align-self: center; font-size: 48px; line-height: 56px; font-weight: 700; letter-spacing: -0.04em">{{lev}}×</span>
      <div style="position: relative; height: 28px; margin: 16px 12px 0">
        <div style="position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: {{t.track}}"></div>
        <div style="position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; width: {{fillW}}; background: {{sideColor}}"></div>
        <sc-for list="{{ticks}}" as="k" hint-placeholder-count="5">
          <span style="position: absolute; top: 11px; left: {{k.x}}; width: 6px; height: 6px; margin-left: -3px; border-radius: 999px; background: {{k.c}}"></span>
        </sc-for>
        <span style="position: absolute; top: 2px; left: {{fillW}}; width: 24px; height: 24px; margin-left: -12px; box-sizing: border-box; border-radius: 999px; border: 4px solid {{sideColor}}; background: {{t.bg}}; transition: left 160ms ease"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
        <sc-for list="{{levs}}" as="l" hint-placeholder-count="5">
          <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.on}}" aria-label="{{l.label}} leverage" class="m" style="height: 40px; padding: 0; border: none; background: transparent; color: {{l.fg}}; font-size: 13px; font-weight: {{l.w}}; text-align: {{l.align}}; cursor: pointer">{{l.label}}</button>
        </sc-for>
      </div>
      <dl style="margin: 16px 0 0; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Position size</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{size}}</dd></div>
        <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Liquidation price</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{liq}}</dd></div>
        <div style="display: flex; justify-content: space-between"><dt style="font-size: 13px; color: {{t.text3}}">Health factor</dt><dd class="m" style="margin: 0; font-size: 13px; font-weight: 600">{{hf}}</dd></div>
      </dl>
      <button type="button" onClick="{{closeLev}}" style="margin-top: 20px; height: 56px; border: none; border-radius: 12px; background: {{t.text}}; color: {{t.bg}}; font-size: 16px; font-weight: 700; cursor: pointer">Set {{lev}}×</button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { side: 'long', lev: 3, v: '780', levOpen: false, limit: false };
  }
  tokens() {
    const light = { bg: '#FFFFFF', fill: '#F4F4F4', fieldLine: '#E2E2E2', track: '#E2E2E2', line: 'rgba(17,17,17,0.08)', text: '#111111', text2: '#4B5563', text3: '#6B7280', long: '#32EEE2', short: '#FC5457', onSide: '#111111', negText: '#B33C3E', disabled: '#BFBFBF', scrim: 'rgba(17,17,17,0.4)', sheet: '#FFFFFF' };
    const dark = { bg: '#111111', fill: '#1E1E1E', fieldLine: '#2C2C2C', track: '#2C2C2C', line: 'rgba(255,255,255,0.08)', text: '#FFFFFF', text2: '#BFBFBF', text3: '#949494', long: '#32EEE2', short: '#FC5457', onSide: '#111111', negText: '#FD8C8E', disabled: '#595959', scrim: 'rgba(0,0,0,0.6)', sheet: '#1E1E1E' };
    return (this.props.theme ?? 'light') === 'dark' ? dark : light;
  }
  renderVals() {
    const t = this.tokens();
    const P = 368.44, BAL = 3120.55;
    const long = this.state.side === 'long';
    const L = this.state.lev;
    const v = this.state.v;
    const num = parseFloat(v || '0') || 0;
    const over = num > BAL;
    const sideColor = long ? t.long : t.short;
    const f2 = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const setV = (nv) => this.setState({ v: nv });
    const onAmt = (e) => {
      let x = String(e.target.value).replace(/,/g, '.').replace(/[^0-9.]/g, '');
      const i = x.indexOf('.');
      if (i >= 0) x = x.slice(0, i + 1) + x.slice(i + 1).replace(/\./g, '').slice(0, 2);
      if (x !== this.state.v) this.setState({ v: x });
    };
    const pcts = [['25%', 0.25], ['50%', 0.5], ['75%', 0.75], ['Max', 1]].map(([label, k]) => ({
      label: label, pick: () => setV((BAL * k).toFixed(2))
    }));
    const intPart = v.split('.')[0] || '0';
    const dec = v.indexOf('.') >= 0 ? '.' + v.split('.')[1] : '';
    const frac = (L - 1) / 4;
    const levs = [1, 2, 3, 4, 5].map((n, i) => ({
      label: n + '×', on: n === L ? 'true' : 'false',
      fg: n === L ? t.text : t.text3, w: n === L ? 700 : 500,
      align: i === 0 ? 'left' : (i === 4 ? 'right' : 'center'),
      pick: () => this.setState({ lev: n })
    }));
    const ticks = [0, 1, 2, 3, 4].map((i) => ({ x: (i * 25) + '%', c: i / 4 <= frac ? sideColor : t.track }));
    let liq = '—', hf = '—';
    if (L > 1) {
      hf = f2(L / (L - 1));
      liq = '$' + f2(long ? 1.1 * (L - 1) * P / L : L * P / (1.1 * (L - 1)));
    }
    const empty = num === 0;
    return {
      t: t,
      display: Number(intPart).toLocaleString('en-US') + dec,
      amtColor: over ? t.negText : (empty ? t.text3 : t.text),
      sideColor: sideColor,
      lev: L, levs: levs, ticks: ticks, pcts: pcts, onAmt: onAmt, v: v, inW: Math.max(1, (v || '0').length) + 0.2 + 'ch', borrowed: '$' + f2(num * (L - 1)), fee: '$' + f2(num * L * 0.0005),
      fillW: (frac * 100) + '%',
      size: '$' + f2(num * L),
      units: (num * L / P).toFixed(4),
      liq: liq, hf: hf,
      ctaBg: empty || over ? t.disabled : sideColor,
      ctaFg: empty || over ? '#FFFFFF' : t.onSide,
      cta: over ? 'Not enough USDC' : (empty ? 'Enter an amount' : 'Review ' + (long ? 'long' : 'short') + ' · ' + L + '×'),
      longSel: long ? 'true' : 'false',
      shortSel: long ? 'false' : 'true',
      longBg: long ? t.long : 'transparent',
      longFg: long ? t.onSide : t.text3,
      shortBg: long ? 'transparent' : t.short,
      shortFg: long ? t.text3 : t.onSide,
      levOpen: this.state.levOpen, openLev: () => this.setState({ levOpen: true }), closeLev: () => this.setState({ levOpen: false }),
      otype: this.state.limit ? 'Limit' : 'Market', isLimit: this.state.limit, toggleType: () => this.setState({ limit: !this.state.limit }),
      goLong: () => this.setState({ side: 'long' }),
      goShort: () => this.setState({ side: 'short' })
    };
  }
}
</script>
</body>
</html>
